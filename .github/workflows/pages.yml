# Publishes the Control Tower UI testbed to GitHub Pages (public).
#
# Site layout mirrors the repo so the UI's relative links (../docs, ../tasks)
# keep working:  <site>/ui/  <site>/docs/  <site>/tasks/
# Only static UI files and Markdown docs are published -- no scripts or
# repository internals. The UI reads public, read-only data sources only
# (allow-list in ui/js/config.js).
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'docs/**'
      - 'tasks/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}ui/
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r ui docs tasks _site/
          # Local-only helper scripts are not part of the site.
          find _site -name '*.py' -delete
          # Tests are not part of the site.
          rm -rf _site/ui/tests
          # Site root opens the app.
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=ui/">' \
            '<title>AI Control Tower</title>' \
            '<a href="ui/">Open the Control Tower UI</a>' > _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
