<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strict CSP: only same-origin scripts/styles/images, no network calls. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>AI Control Tower</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Everything is rendered by js/app.js from local mock state (js/state.js). -->
  <div id="app" class="app">
    <noscript>The Control Tower UI test needs JavaScript enabled.</noscript>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
